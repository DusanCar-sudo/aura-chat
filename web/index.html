<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23fe8019'/><text x='8' y='12.5' font-size='12' font-family='monospace' font-weight='700' text-anchor='middle' fill='%231d2021'>A</text></svg>">
<style>
  :root { --bg:#1d2021; --bg2:#282828; --sel:#3c3836; --fg:#ebdbb2; --hi:#fbf1c7; --mut:#928374; --acc:#fe8019; --ok:#b8bb26; --y:#fabd2f; --red:#fb4934; }
  * { box-sizing: border-box; border-radius: 0; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 13px/1.5 "JetBrains Mono","JetBrainsMono Nerd Font",ui-monospace,Menlo,Consolas,monospace; display: flex; flex-direction: column; }
  button { font: inherit; cursor: pointer; background: var(--bg); color: var(--acc); border: 2px solid var(--acc); padding: 3px 10px; font-weight: 700; }
  button:hover { background: var(--acc); color: var(--bg); }
  button.quiet { border-color: var(--sel); color: var(--mut); }
  button.quiet:hover { background: var(--sel); color: var(--hi); }
  header { display: flex; align-items: center; gap: 10px; background: var(--acc); color: var(--bg); padding: 4px 10px; font-weight: 700; }
  header .grow { flex: 1; }
  header small { font-weight: 400; opacity: .85; }
  header button { border-color: var(--bg); color: var(--bg); background: var(--acc); padding: 0 8px; }
  header button:hover { background: var(--bg); color: var(--acc); }
  main { flex: 1; display: flex; min-height: 0; }
  aside { width: 280px; border-right: 2px solid var(--acc); display: flex; flex-direction: column; min-height: 0; }
  aside h2 { margin: 0; font-size: 12px; padding: 6px 10px; color: var(--y); border-bottom: 1px solid var(--sel); display: flex; justify-content: space-between; }
  aside .list { overflow-y: auto; flex: 1; min-height: 60px; }
  .item { padding: 5px 10px; border-bottom: 1px solid var(--sel); cursor: default; }
  .item:hover { background: var(--bg2); }
  .item .t { color: var(--hi); }
  .item .s { color: var(--mut); font-size: 11px; }
  .item .x { float: right; color: var(--mut); cursor: pointer; margin-left: 6px; }
  .item .x:hover { color: var(--red); }
  .tag { color: var(--acc); }
  .local { color: var(--y); }
  section { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .m { white-space: pre-wrap; word-wrap: break-word; padding-left: 10px; border-left: 2px solid var(--sel); max-width: 900px; }
  .m::before { display: block; font-weight: 700; }
  .u { border-left-color: var(--y); color: var(--hi); } .u::before { content: "you"; color: var(--y); }
  .a { border-left-color: var(--acc); } .a::before { content: "aura"; color: var(--acc); }
  .sys { color: var(--mut); border-left-color: var(--sel); } .sys::before { content: "·"; }
  .a pre { background: var(--bg2); border: 1px solid var(--sel); padding: 6px 8px; overflow-x: auto; white-space: pre; margin: 4px 0; }
  .a code { color: var(--ok); }
  form { display: flex; border-top: 2px solid var(--acc); }
  form span { color: var(--acc); padding: 10px 0 0 10px; font-weight: 700; }
  textarea { flex: 1; resize: none; height: 44px; border: 0; outline: 0; padding: 10px; background: var(--bg); color: var(--hi); font: inherit; }
  form button { border: 0; border-left: 2px solid var(--acc); padding: 0 18px; }
  form button:disabled { color: var(--mut); background: var(--bg); cursor: default; }
  #gate { position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center; }
  #gate.show { display: flex; }
  #gate div { border: 2px solid var(--acc); box-shadow: 6px 6px 0 rgba(0,0,0,.45); padding: 20px 24px; max-width: 440px; }
  #gate h1 { margin: 0 0 8px; font-size: 16px; color: var(--acc); }
  #gate p { color: var(--mut); margin: 0 0 14px; }
  @media (max-width: 760px) { aside { display: none; } aside.open { display: flex; position: fixed; top: 30px; bottom: 0; left: 0; z-index: 5; background: var(--bg); width: 86vw; } }
</style>
</head>
<body>
<header>
  <button id="menu" title="Memories and chats">≡</button>
  <span>▌ AURA</span><small id="who">not signed in</small>
  <span class="grow"></span>
  <small id="sync"></small>
  <button id="new" title="New chat">[+] NEW</button>
</header>
<main>
  <aside id="side">
    <h2>CHATS <span id="nthreads"></span></h2>
    <div class="list" id="threads"></div>
    <h2>MEMORY <span id="nmem"></span></h2>
    <div class="list" id="mems"></div>
  </aside>
  <section>
    <div id="log"></div>
    <form id="f"><span>&gt;</span><textarea id="q" placeholder="talk to aura…" aria-label="Message"></textarea><button id="send">SEND</button></form>
  </section>
</main>
<div id="gate"><div>
  <h1>▌ AURA</h1>
  <p>Sign in with Puter (free). Your Puter account runs the AI and keeps Aura's memory, so she is the same Aura on the web, your phone and Telegram.</p>
  <button id="signin">SIGN IN WITH PUTER</button>
</div></div>
<script src="https://js.puter.com/v2/"></script>
<script src="memory.js"></script>
<script src="app.js"></script>
</body>
</html>
