<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publish Aura to Puter</title>
<style>
  :root { --bg:#1d2021; --fg:#ebdbb2; --mut:#928374; --acc:#fe8019; --ok:#b8bb26; --red:#fb4934; }
  * { box-sizing: border-box; border-radius: 0; }
  body { background: var(--bg); color: var(--fg); font: 13px/1.6 "JetBrains Mono",ui-monospace,Menlo,monospace; margin: 0; padding: 32px 16px; }
  .box { max-width: 560px; margin: 0 auto; border: 2px solid var(--acc); box-shadow: 6px 6px 0 rgba(0,0,0,.45); }
  h1 { margin: 0; background: var(--acc); color: var(--bg); font-size: 14px; padding: 4px 10px; }
  .in { padding: 14px 16px; }
  label { display: block; color: var(--mut); margin-top: 8px; }
  input { width: 100%; font: inherit; background: var(--bg); color: #fbf1c7; border: 2px solid #3c3836; padding: 6px 8px; outline: 0; }
  input:focus { border-color: var(--acc); }
  button { font: inherit; font-weight: 700; margin-top: 14px; background: var(--bg); color: var(--acc); border: 2px solid var(--acc); padding: 6px 14px; cursor: pointer; }
  button:hover { background: var(--acc); color: var(--bg); }
  button:disabled { opacity: .5; cursor: default; }
  pre { white-space: pre-wrap; margin: 14px 0 0; border-top: 1px dashed #3c3836; padding-top: 10px; }
  .ok { color: var(--ok); } .err { color: var(--red); }
  a { color: var(--acc); }
</style>
</head>
<body>
<div class="box">
  <h1>▌ PUBLISH AURA TO PUTER</h1>
  <div class="in">
    Uploads this web client (index.html, app.js, memory.js) to your Puter
    storage, hosts it on puter.site and adds <b>Aura</b> to your Puter desktop.
    Run it again any time to update.
    <label for="sub">address: https://<b>[name]</b>.puter.site</label>
    <input id="sub" autocomplete="off" spellcheck="false">
    <button id="go">PUBLISH</button>
    <pre id="out"></pre>
  </div>
</div>
<script src="https://js.puter.com/v2/"></script>
<script>
(async function () {
  var out = document.getElementById("out"), go = document.getElementById("go"), sub = document.getElementById("sub");
  function say(t, cls) { var s = document.createElement("span"); if (cls) s.className = cls; s.textContent = t + "\n"; out.appendChild(s); }
  var FILES = ["index.html", "app.js", "memory.js"];
  var DIR = "AuraWeb";
  var APP = "aura-me";

  go.onclick = async function () {
    go.disabled = true; out.textContent = "";
    try {
      if (!puter.auth.isSignedIn()) { say("signing in to Puter…"); await puter.auth.signIn(); }
      var user = await puter.auth.getUser();
      var name = (sub.value || ("aura-" + user.username)).toLowerCase().replace(/[^a-z0-9-]/g, "-");
      sub.value = name;
      say("signed in as " + user.username);

      try { await puter.fs.mkdir(DIR); say("created ~/" + DIR); } catch (e) { say("~/" + DIR + " exists, updating"); }
      for (var i = 0; i < FILES.length; i++) {
        var body = await (await fetch(FILES[i], { cache: "no-store" })).text();
        await puter.fs.write(DIR + "/" + FILES[i], body, { overwrite: true });
        say("uploaded " + FILES[i] + " (" + body.length + " bytes)");
      }

      var site;
      try { site = await puter.hosting.create(name, DIR); say("hosting created"); }
      catch (e) {
        try { await puter.hosting.update(name, DIR); site = await puter.hosting.get(name); say("hosting updated"); }
        catch (e2) { throw new Error("address " + name + ".puter.site is taken or failed: " + (e2.message || e2)); }
      }
      var url = "https://" + name + ".puter.site";

      try {
        await puter.apps.create({ name: APP, indexURL: url, title: "Aura", description: "Aura: the same AI and memory on the web, your phone and Telegram.", maximizeOnStart: false });
        say("app 'Aura' added to your Puter desktop");
      } catch (e) {
        try { await puter.apps.update(APP, { indexURL: url, title: "Aura" }); say("app 'Aura' updated"); }
        catch (e2) { say("app registration skipped: " + (e2.message || e2), "err"); }
      }

      say("");
      say("done: " + url, "ok");
      var a = document.createElement("a"); a.href = url; a.target = "_blank"; a.textContent = "open " + url; out.appendChild(a);
    } catch (e) {
      say("failed: " + (e && (e.message || (e.error && e.error.message)) || e), "err");
    } finally {
      go.disabled = false;
    }
  };

  try { if (puter.auth.isSignedIn()) sub.placeholder = "aura-" + (await puter.auth.getUser()).username; else sub.placeholder = "aura-yourname"; } catch (e) {}
})();
</script>
</body>
</html>
